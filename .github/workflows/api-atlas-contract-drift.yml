name: API Atlas contract drift

on:
  pull_request:
    paths:
      - 'services/greenfield-api/**'
      - 'services/greenfield-worker/**'
      - 'apps/**'
      - 'ops/**'
      - 'packages/**'
      - 'tools/api-atlas/**'
      - 'scripts/**'
      - 'docs/audits/api-atlas-01/**'
      - 'docs/architecture/**'
      - 'docs/validation/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]

jobs:
  atlas:
    runs-on: ubuntu-latest
    env:
      # Pre-deployment contract drift is reconciled against the committed local
      # candidate capture. Production facts remain in production-snapshot.json.
      API_ATLAS_RUNTIME_EVIDENCE: candidate
    defaults:
      run:
        working-directory: modula-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: modula-latest
          # Production evidence may be pinned to an accepted ancestor with
          # unchanged API source; shallow history cannot prove that ancestry.
          fetch-depth: 0
      - name: Check out pinned Module Standard dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modula-mod/modula-module-standard
          ref: eebf12c7df0583a5051fc584170f7f3a9f6d946c
          path: modula-mod/modula-module-standard
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: modula-latest/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:atlas:verify
      - run: pnpm api:atlas:secrets
      - name: Require committed contract updates
        run: git diff --exit-code -- docs/audits/api-atlas-01 tools/api-atlas package.json

  repository-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modula-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: modula-latest
      - name: Check out pinned Module Standard dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modula-mod/modula-module-standard
          ref: eebf12c7df0583a5051fc584170f7f3a9f6d946c
          path: modula-mod/modula-module-standard
      - name: Check out canonical Vault Notes test fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modula-mod/modula-vault-notes
          ref: bd5440278831cf97dfa2a6882125d207af013def
          path: modula-mod/modula-vault-notes
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: modula-latest/pnpm-lock.yaml
      - name: Migration numbering and runner order guard (GF-SIGN-02)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${BASE_REF}" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            node scripts/verify-migration-ordering.mjs --base-ref "origin/${BASE_REF}"
          else
            node scripts/verify-migration-ordering.mjs
          fi
          node --test scripts/verify-migration-ordering.test.mjs
      - name: Build pinned Module Standard contracts
        working-directory: modula-mod/modula-module-standard
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - name: GreenField v1 frozen contract snapshots
        run: CI=true pnpm verify:greenfield-v1-contract-freeze
      - name: GreenField v1 permission declaration and enforcement inventory
        run: CI=true pnpm verify:greenfield-v1-permissions
      - name: GreenField v1 deployment and backup safety contract
        run: CI=true pnpm verify:greenfield-v1-deploy-safety
      - name: GreenField v1 off-host backup copy contract (GF-OPS-02)
        run: CI=true pnpm verify:greenfield-v1-offhost-backup
      - name: API tests
        run: CI=true pnpm api:test
      - name: Worker tests
        run: CI=true pnpm worker:test
      - name: Module SDK contract tests
        run: CI=true pnpm --filter @modula/greenfield-module-sdk test
      - name: Product UI contract tests
        run: CI=true pnpm --filter @modula/greenfield-module-ui-contracts test
      - name: Intelligence governance tests
        run: CI=true pnpm --filter @modula/intelligence-governance test
      - name: API typecheck
        run: CI=true pnpm --filter @modula/greenfield-api typecheck
      - name: Worker typecheck
        run: CI=true pnpm --filter @modula/greenfield-worker typecheck
      - name: Root typecheck
        run: CI=true pnpm typecheck
      - name: Root lint
        run: CI=true pnpm lint
      - name: Production web build
        run: CI=true pnpm build:web
      - name: Vault runtime special-case gate
        run: CI=true pnpm verify:mp02b-vault-special-cases
      - name: Module distribution immutable cache edge contract
        run: CI=true pnpm verify:module-distribution-nginx
      - name: Trust bootstrap CLI typecheck
        run: >-
          pnpm --filter @modula/greenfield-api exec tsc --noEmit --module NodeNext
          --moduleResolution NodeNext --target ES2022 --strict --skipLibCheck
          scripts/trust-bootstrap.ts scripts/migrate-legacy-installations.ts
          scripts/trust-cutover-gate.ts scripts/api-fix-01d-crypto-acceptance.ts
      - name: Legacy data preflight CLI typecheck
        run: >-
          pnpm --filter @modula/greenfield-worker exec tsc --noEmit --module NodeNext
          --moduleResolution NodeNext --target ES2022 --strict --skipLibCheck
          scripts/legacy-data-preflight.ts

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: modula_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d modula_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: modula-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: modula-latest
      - name: Check out pinned Module Standard dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: modula-mod/modula-module-standard
          ref: eebf12c7df0583a5051fc584170f7f3a9f6d946c
          path: modula-mod/modula-module-standard
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: modula-latest/pnpm-lock.yaml
      - name: Build pinned Module Standard contracts
        working-directory: modula-mod/modula-module-standard
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm install --frozen-lockfile
      - name: Build API workspace dependencies
        run: pnpm --filter @modula/greenfield-api... build
      - name: GF-TEST-DB-01 zero-skip guard unit tests
        run: node --test scripts/assert-vitest-db-suites-ran.test.mjs
      - name: Create restricted database roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: modula_test
          MODULA_MIGRATOR_PASSWORD: modula_ci_migrator
          MODULA_API_PASSWORD: modula_ci_api
          MODULA_WORKER_PASSWORD: modula_ci_worker
          MODULA_READONLY_PASSWORD: modula_ci_readonly
          MODULA_BACKUP_PASSWORD: modula_ci_backup
          MODULA_SIGNING_RUNNER_PASSWORD: modula_ci_signing_runner
          MODULA_RELEASE_APPROVER_PASSWORD: modula_ci_release_approver
          MODULA_TRUST_VERIFIER_PASSWORD: modula_ci_trust_verifier
          MODULA_PUBLICATION_AUTHORITY_PASSWORD: modula_ci_publication_authority
          MODULA_PUBLISHER_TRUST_AUTHORITY_PASSWORD: modula_ci_publisher_trust
          MODULA_SIGNING_IDENTITY_AUTHORITY_PASSWORD: modula_ci_signing_identity
          MODULA_QUARANTINE_AUTHORITY_PASSWORD: modula_ci_quarantine
          MODULA_REVOCATION_AUTHORITY_PASSWORD: modula_ci_revocation
        run: bash ops/docker/postgres/init-roles.sh
      - name: Apply migrations before authority grant installation
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
        run: >-
          CI=true pnpm --filter @modula/greenfield-api exec tsx -e
          "import {migrateUp} from './src/database/migrate.ts';
          void migrateUp(process.env.MODULA_TEST_DATABASE_URL).then(applied =>
          console.log(JSON.stringify({applied, tip: applied.at(-1) ?? 'already-current'})))"
      - name: Bind restricted publisher authority principals
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname "${MODULA_TEST_DATABASE_URL}" <<'SQL'
          INSERT INTO greenfield_accounts (account_id, primary_handle, status, created_at, updated_at) VALUES
            ('r2-approver-account', 'r2approver', 'active', pg_catalog.clock_timestamp(), pg_catalog.clock_timestamp()),
            ('r2-publication-account', 'r2publication', 'active', pg_catalog.clock_timestamp(), pg_catalog.clock_timestamp()),
            ('r3a-publisher-trust-account', 'r3apublishertrust', 'active', pg_catalog.clock_timestamp(), pg_catalog.clock_timestamp()),
            ('r3a2-signing-identity-account', 'r3a2signingidentity', 'active', pg_catalog.clock_timestamp(), pg_catalog.clock_timestamp()),
            ('r3a2-quarantine-authority-account', 'r3a2quarantineauthority', 'active', pg_catalog.clock_timestamp(), pg_catalog.clock_timestamp()),
            ('r3a3-revocation-authority-account', 'r3a3revocationauthority', 'active', pg_catalog.clock_timestamp(), pg_catalog.clock_timestamp())
          ON CONFLICT (account_id) DO NOTHING;
          SQL
          psql --no-psqlrc --dbname "${MODULA_TEST_DATABASE_URL}" \
            --set=runner_role=r2_signing_runner \
            --set=approver_role=r2_release_approver \
            --set=approver_account_id=r2-approver-account \
            --set=trust_verifier_role=r2_trust_verifier \
            --set=publication_authority_role=r2_publication_authority \
            --set=publication_authority_account_id=r2-publication-account \
            --set=publisher_trust_authority_role=r3a_publisher_trust_authority \
            --set=publisher_trust_authority_account_id=r3a-publisher-trust-account \
            --set=signing_identity_authority_role=r3a2_signing_identity_authority \
            --set=signing_identity_authority_account_id=r3a2-signing-identity-account \
            --set=quarantine_authority_role=r3a2_quarantine_authority \
            --set=quarantine_authority_account_id=r3a2-quarantine-authority-account \
            --set=revocation_authority_role=r3a3_revocation_authority \
            --set=revocation_authority_account_id=r3a3-revocation-authority-account \
            --file ops/security/publisher-release-runner-grants.sql
      - name: Publisher signing canonical boundary (17 tests, zero skips)
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
          MODULA_TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/modula_test
          MODULA_SIGNING_RUNNER_DATABASE_URL: postgresql://r2_signing_runner:modula_ci_signing_runner@127.0.0.1:5432/modula_test
          MODULA_RELEASE_APPROVER_DATABASE_URL: postgresql://r2_release_approver:modula_ci_release_approver@127.0.0.1:5432/modula_test
          MODULA_TRUST_VERIFIER_DATABASE_URL: postgresql://r2_trust_verifier:modula_ci_trust_verifier@127.0.0.1:5432/modula_test
          MODULA_PUBLICATION_AUTHORITY_DATABASE_URL: postgresql://r2_publication_authority:modula_ci_publication_authority@127.0.0.1:5432/modula_test
          MODULA_PUBLISHER_TRUST_AUTHORITY_DATABASE_URL: postgresql://r3a_publisher_trust_authority:modula_ci_publisher_trust@127.0.0.1:5432/modula_test
          MODULA_SIGNING_IDENTITY_AUTHORITY_DATABASE_URL: postgresql://r3a2_signing_identity_authority:modula_ci_signing_identity@127.0.0.1:5432/modula_test
          MODULA_QUARANTINE_AUTHORITY_DATABASE_URL: postgresql://r3a2_quarantine_authority:modula_ci_quarantine@127.0.0.1:5432/modula_test
          MODULA_REVOCATION_AUTHORITY_DATABASE_URL: postgresql://r3a3_revocation_authority:modula_ci_revocation@127.0.0.1:5432/modula_test
          MODULA_API_DATABASE_URL: postgresql://modula_api:modula_ci_api@127.0.0.1:5432/modula_test
          MODULA_WORKER_DATABASE_URL: postgresql://modula_worker:modula_ci_worker@127.0.0.1:5432/modula_test
        run: >-
          CI=true pnpm --filter @modula/greenfield-api exec vitest run
          tests/publisher-release-runner-boundary.test.ts
          --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json
          --outputFile.json=/tmp/publisher-signing-boundary-vitest.json
          && node scripts/assert-vitest-db-suites-ran.mjs
          /tmp/publisher-signing-boundary-vitest.json
          tests/publisher-release-runner-boundary.test.ts
          && node -e "const report=require('/tmp/publisher-signing-boundary-vitest.json');
          if(report.numTotalTests!==17||report.numPassedTests!==17||report.numPendingTests!==0||report.numFailedTests!==0)
          {console.error('Expected canonical publisher boundary result 17 passed, 0 skipped, 0 failed');process.exit(1)}"
      - name: Full migration chain and API-FIX-01 database regressions
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
          MODULA_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MODULA_TEST_WORKER_DATABASE_URL: postgresql://modula_worker:modula_ci_worker@127.0.0.1:5432/modula_test
          MODULA_TRUST_VERIFIER_DATABASE_URL: postgresql://r2_trust_verifier:modula_ci_trust_verifier@127.0.0.1:5432/modula_test
          MODULA_PUBLICATION_AUTHORITY_DATABASE_URL: postgresql://r2_publication_authority:modula_ci_publication_authority@127.0.0.1:5432/modula_test
          MODULA_SIGNING_IDENTITY_AUTHORITY_DATABASE_URL: postgresql://r3a2_signing_identity_authority:modula_ci_signing_identity@127.0.0.1:5432/modula_test
          MODULA_QUARANTINE_AUTHORITY_DATABASE_URL: postgresql://r3a2_quarantine_authority:modula_ci_quarantine@127.0.0.1:5432/modula_test
          MODULA_REVOCATION_AUTHORITY_DATABASE_URL: postgresql://r3a3_revocation_authority:modula_ci_revocation@127.0.0.1:5432/modula_test
        run: >-
          CI=true pnpm --filter @modula/greenfield-api exec vitest run
          tests/settings-v2.integration.test.ts
          tests/greenfield-backend-v1.migration-ledger-security.test.ts
          tests/api-fix-01.migration.test.ts
          tests/api-fix-01.reaction-dead-letter-retry.test.ts
          tests/api-baseline-02.security-acceptance.test.ts
          tests/api-fix-01.follow-privacy.test.ts
          tests/module-version-switch.test.ts
          --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json
          --outputFile.json=/tmp/full-migration-regressions-vitest.json
          && node scripts/assert-vitest-db-suites-ran.mjs /tmp/full-migration-regressions-vitest.json
          tests/settings-v2.integration.test.ts
          tests/greenfield-backend-v1.migration-ledger-security.test.ts
          tests/api-fix-01.migration.test.ts
          tests/api-fix-01.reaction-dead-letter-retry.test.ts
          tests/api-baseline-02.security-acceptance.test.ts
          tests/api-fix-01.follow-privacy.test.ts
          tests/module-version-switch.test.ts
      - name: Forward-only migration protections (093-095, zero skips)
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
          MODULA_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          CI=true pnpm --filter @modula/greenfield-api exec vitest run
          tests/publisher-forward-only-migrations.test.ts
          --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json
          --outputFile.json=/tmp/publisher-forward-only-migrations-vitest.json
          && node scripts/assert-vitest-db-suites-ran.mjs
          /tmp/publisher-forward-only-migrations-vitest.json
          tests/publisher-forward-only-migrations.test.ts
          && node -e "const report=require('/tmp/publisher-forward-only-migrations-vitest.json');
          if(report.numTotalTests!==3||report.numPassedTests!==3||report.numPendingTests!==0||report.numFailedTests!==0)
          {console.error('Expected forward-only migration result 3 passed, 0 skipped, 0 failed');process.exit(1)}"
      - name: API-FIX-01 worker database regressions
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
          MODULA_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MODULA_TEST_WORKER_DATABASE_URL: postgresql://modula_worker:modula_ci_worker@127.0.0.1:5432/modula_test
        run: >-
          CI=true pnpm --filter @modula/greenfield-worker exec vitest run
          tests/phase7e.notifications.test.ts
          tests/media-cleanup.test.ts
          tests/module-trust-guard.test.ts
          tests/legacy-installation-data-migration.test.ts
          tests/phase7e.vault-notes-search-projector.test.ts
          --maxWorkers=1 --no-file-parallelism
          --reporter=default --reporter=json
          --outputFile.json=/tmp/api-fix-worker-regressions-vitest.json
          && node scripts/assert-vitest-db-suites-ran.mjs /tmp/api-fix-worker-regressions-vitest.json
          tests/phase7e.notifications.test.ts
          tests/media-cleanup.test.ts
          tests/module-trust-guard.test.ts
          tests/legacy-installation-data-migration.test.ts
          tests/phase7e.vault-notes-search-projector.test.ts
      - name: Dedicated backup role logical dump
        env:
          PGPASSWORD: modula_ci_backup
        run: >-
          pg_dump --format=custom --no-owner --no-privileges
          --dbname postgresql://modula_backup@127.0.0.1:5432/modula_test
          --file /tmp/modula-backup-role-validation.dump
      - name: Historical MP02 migration cycle through schema 091
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          historical_database=modula_mp02_historical
          historical_migrations="$(mktemp -d)"
          cleanup() {
            dropdb --host=127.0.0.1 --port=5432 --username=postgres --force --if-exists "${historical_database}"
            find "${historical_migrations}" -mindepth 1 -delete
            rmdir "${historical_migrations}"
          }
          trap cleanup EXIT

          createdb --host=127.0.0.1 --port=5432 --username=postgres \
            --owner=modula_migrator "${historical_database}"
          while IFS= read -r migration; do
            migration_name="${migration##*/}"
            migration_number="${migration_name:0:3}"
            if [ "$((10#${migration_number}))" -le 91 ]; then
              cp "${migration}" "${historical_migrations}/${migration_name}"
            fi
          done < <(find services/greenfield-api/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

          test -f "${historical_migrations}/091_greenfield_online_signing_authority.sql"
          test ! -e "${historical_migrations}/092_publisher_release_runner_boundary.sql"
          while IFS= read -r migration; do
            case "${migration}" in
              *.down.sql) continue ;;
            esac
            test -f "${migration%.sql}.down.sql"
          done < <(find "${historical_migrations}" -maxdepth 1 -type f -name '*.sql' -print | sort)

          export MODULA_TEST_DATABASE_URL="postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/${historical_database}"
          CI=true pnpm --filter @modula/greenfield-api exec tsx \
            scripts/verify-migration-cycle.ts 068_module_platform_records \
            --migrations-dir "${historical_migrations}" \
            --expected-tip 091_greenfield_online_signing_authority \
            --apply-baseline
      - name: Primary CI database remains at schema 095
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
        run: >-
          CI=true pnpm --filter @modula/greenfield-api exec tsx
          scripts/verify-migration-tip.ts 095_publisher_signing_integration_completion
      - name: Current-schema MP02 and MP02B database acceptance
        env:
          MODULA_TEST_DATABASE_URL: postgresql://modula_migrator:modula_ci_migrator@127.0.0.1:5432/modula_test
          MODULA_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MODULA_TEST_WORKER_DATABASE_URL: postgresql://modula_worker:modula_ci_worker@127.0.0.1:5432/modula_test
          MODULA_TRUST_VERIFIER_DATABASE_URL: postgresql://r2_trust_verifier:modula_ci_trust_verifier@127.0.0.1:5432/modula_test
          MODULA_PUBLICATION_AUTHORITY_DATABASE_URL: postgresql://r2_publication_authority:modula_ci_publication_authority@127.0.0.1:5432/modula_test
          MODULA_SIGNING_IDENTITY_AUTHORITY_DATABASE_URL: postgresql://r3a2_signing_identity_authority:modula_ci_signing_identity@127.0.0.1:5432/modula_test
          MODULA_QUARANTINE_AUTHORITY_DATABASE_URL: postgresql://r3a2_quarantine_authority:modula_ci_quarantine@127.0.0.1:5432/modula_test
          MODULA_REVOCATION_AUTHORITY_DATABASE_URL: postgresql://r3a3_revocation_authority:modula_ci_revocation@127.0.0.1:5432/modula_test
        run: >-
          CI=true pnpm --filter @modula/greenfield-api exec vitest run
          tests/module-platform-02.records.test.ts
          tests/permission-reconciliation.test.ts
          tests/module-platform-02b.media-sharing.test.ts
          tests/module-platform-02b.functions-actions.test.ts
          tests/module-platform-02b.search-contract.test.ts
          tests/module-platform-02b.canonical-mutations.test.ts
          --maxWorkers=1 --no-file-parallelism
