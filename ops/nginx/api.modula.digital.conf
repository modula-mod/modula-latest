server {
    listen 87.106.40.136:80;
    listen [2a02:2479:68:e400::]:80;
    server_name api.modula.digital;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/modula/acme/api.modula.digital/public_html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 87.106.40.136:443 ssl;
    listen [2a02:2479:68:e400::]:443 ssl;
    server_name api.modula.digital;
    ssl_certificate     /etc/letsencrypt/live/api.modula.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.modula.digital/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header Cache-Control "no-store" always;
    }

    # Digest-addressed registry artifacts and immutable release artwork own
    # their cache policy in the API. Do not append the catch-all no-store
    # directive to these responses.
    location ~ "^/v1/registry/(?:artifacts/[0-9a-f]{64}|releases/[^/]+/assets/[^/]+)$" {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /v1/stories {
        client_max_body_size 25m;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/v1/attachments/uploads/[0-9a-fA-F-]+/content$ {
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        add_header Cache-Control "no-store" always;
    }
}
