server {
    listen 87.106.40.136:443 ssl;
    listen [2a02:2479:68:e400::]:443 ssl;
    http2 on;
    server_name api.modula.digital;

    ssl_certificate     /home/andrei/conf/web/api.modula.digital/ssl/api.modula.digital.pem;
    ssl_certificate_key /home/andrei/conf/web/api.modula.digital/ssl/api.modula.digital.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4020;
    }

    # Immutable registry bytes own their cache policy in the API. Public
    # artwork remains public/immutable; installation artifacts remain private
    # and immutable. Neither may inherit the catch-all no-store directive.
    location ~ "^/v1/registry/(?:artifacts/[0-9a-f]{64}|releases/[^/]+/assets/[^/]+)$" {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4020;
    }

    location = /v1/stories {
        client_max_body_size 25m;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4020;
    }

    location ~ ^/v1/attachments/uploads/[0-9a-fA-F-]+/content$ {
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4020;
    }
}
